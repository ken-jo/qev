   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52616a" transform="translate(51.48 378.247375)">Typed decisions: adapted benchmark for QEV and LAYA specialist. News/emotion: no QEV task-specific adaptation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52616a" transform="translate(51.48 394.247375)">LAYA reports news in its training mix and emotion held out. Pretraining overlap is unknown.</text>
