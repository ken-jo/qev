name: Publish QEV to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build --outdir python-dist
          python -m twine check --strict python-dist/*
          python scripts/verify_python_distribution.py --directory python-dist
      - name: Check installed command
        run: |
          python -m pip install --no-deps python-dist/*.whl
          qev --help
          python -c "import qev; assert qev.__version__ == '0.1.1'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qev-python-distributions
          path: python-dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qev/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qev-python-distributions
          path: python-dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-dist/
