[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qwen3.5-classification"
version = "0.1.0"
description = "Dynamic typed decisions over images and text with Qwen3.5-2B"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "numpy==2.5.3",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pydantic==2.13.5",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
]

[project.scripts]
"qwen3.5-classification" = "qwen3_5_classification.cli:main"
veyra = "veyra.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx>=0.28,<1", "ruff>=0.15,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/veyra", "src/qwen3_5_classification"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
