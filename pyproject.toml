[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qev"
version = "0.2.0"
description = "LAYA-inspired typed decisions over text and images with Qwen3.5-2B"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ken-jo" }]
keywords = ["classification", "multimodal", "probabilities", "typed-decisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "numpy==2.5.3",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pydantic==2.13.5",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "gradio==6.29.0",
  "huggingface-hub>=1.0,<2",
  "filelock>=3.16,<5",
]

[project.scripts]
qev = "qev.cli:main"
veyra = "veyra.cli:main"

[project.urls]
Homepage = "https://github.com/ken-jo/qev"
Documentation = "https://github.com/ken-jo/qev#readme"
Repository = "https://github.com/ken-jo/qev"
Issues = "https://github.com/ken-jo/qev/issues"
Model = "https://huggingface.co/ken-jo/qev"
Dataset = "https://huggingface.co/datasets/ken-jo/qev-data"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx>=0.28,<1", "ruff>=0.15,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/veyra", "src/qev"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/examples/request.json", "/pyproject.toml", "/README.md",
  "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/MODEL_CARD.md", "/docs/API.md",
  "/docs/ARCHITECTURE.md", "/docs/MODEL_SIZE.md", "/docs/PLAYGROUND.md", "/SUPPORT.md",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
